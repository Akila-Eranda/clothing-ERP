<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Connect HexaOne</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #dbe3ef;
        --accent: #0f766e;
        --danger: #b91c1c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 40%),
          radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.1), transparent 35%),
          var(--bg);
        color: var(--ink);
      }
      .card {
        width: min(520px, 100%);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      .error {
        margin: 0 0 16px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #fef2f2;
        color: var(--danger);
        font-size: 13px;
        word-break: break-word;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 650;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 11px 12px;
        font-size: 14px;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 18px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
      }
      .primary {
        background: var(--accent);
        color: #fff;
      }
      .hint {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      code {
        font-family: Consolas, monospace;
        background: #f1f5f9;
        padding: 1px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Connect to your shop</h1>
      <p>
        HexaOne Desktop needs your live shop URL. Localhost only works when the web app is running on this PC.
      </p>
      <div class="error" id="error" hidden></div>
      <label for="url">Shop URL</label>
      <input
        id="url"
        type="url"
        placeholder="https://your-shop.shop.hexalyte.com"
        autocomplete="off"
      />
      <div class="actions">
        <button class="primary" id="save" type="button">Open shop</button>
      </div>
      <p class="hint">
        Example: <code>https://demo.shop.hexalyte.com</code>
      </p>
    </div>
    <script src="./setup.js"></script>
  </body>
</html>
