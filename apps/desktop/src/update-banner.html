<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Update</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --accent: #0f766e;
        --bg: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", Tahoma, sans-serif;
        -webkit-app-region: drag;
      }
      .card {
        margin: 8px;
        padding: 14px 14px 12px;
        border-radius: 14px;
        background: var(--bg);
        border: 1px solid var(--line);
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.18);
        color: var(--ink);
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .badge {
        flex: 0 0 auto;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: rgba(15, 118, 110, 0.12);
        color: var(--accent);
        font-weight: 800;
        font-size: 14px;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }
      p {
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.4;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
        -webkit-app-region: no-drag;
      }
      button {
        border: 0;
        border-radius: 9px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }
      .ghost {
        background: #f8fafc;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .primary {
        background: var(--accent);
        color: #fff;
      }
      .bar {
        margin-top: 10px;
        height: 6px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
        display: none;
      }
      .bar.show { display: block; }
      .fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #0f766e, #14b8a6);
        transition: width 0.2s ease;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="row">
        <div class="badge">↑</div>
        <div>
          <h1 id="title">Update available</h1>
          <p id="detail">A newer version of HexaOne is ready.</p>
        </div>
      </div>
      <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
      <div class="actions">
        <button class="ghost" id="later" type="button">Later</button>
        <button class="primary" id="action" type="button">Update</button>
      </div>
    </div>
    <script src="./update-banner.js"></script>
  </body>
</html>
